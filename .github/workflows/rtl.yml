name: RTL and archived results
on: [push, pull_request]
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's Verilator 5.020 cannot evaluate the $sformatf graph-file
      # parameters in rtl/neuroSA_machine.sv; use a pinned, current release.
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-01'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: verilator --version && python3 --version
      - run: python -m pip install -r requirements.txt
      - run: make test audit sudoku-test gset-test iteration-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: |
            build/sim/*.log
            build/sim/*.json
            build/sim/*.csv
            build/sim/best_assignment.txt
            build/axi/*.log
            build/audit/*
            build/sudoku_sim/simulation.log
            build/sudoku_sim/recording.json
